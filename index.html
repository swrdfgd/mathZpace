  <script>
    function getRandomHex() {
        const letters = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
    }

    function generateRandomGradient() {
        let numberOfColors = 1;
        while(Math.random() < 0.5 && numberOfColors < 5) {
            numberOfColors++;
        }

        let generatedColors = [];
        for(let i = 0; i < numberOfColors; i++) {
            generatedColors.push(getRandomHex());
        }

        const gradientTypes = ['linear-gradient', 'radial-gradient', 'conic-gradient'];
        const selectedType = gradientTypes[Math.floor(Math.random() * gradientTypes.length)];
        
        if (numberOfColors === 1) {
            return generatedColors[0]; 
        } else {
            let randX = Math.floor(Math.random() * 101);
            let randY = Math.floor(Math.random() * 101);

            if (selectedType === 'linear-gradient') {
                let randomAngle = Math.floor(Math.random() * 360);
                return `linear-gradient(${randomAngle}deg, ${generatedColors.join(', ')})`;
            } else if (selectedType === 'radial-gradient') {
                return `radial-gradient(circle at ${randX}% ${randY}%, ${generatedColors.join(', ')})`;
            } else if (selectedType === 'conic-gradient') {
                let randomAngle = Math.floor(Math.random() * 360);
                let conicColors = [...generatedColors];
                if (Math.random() < 0.5) {
                    conicColors.push(conicColors[0]);
                }
                return `conic-gradient(from ${randomAngle}deg at ${randX}% ${randY}%, ${conicColors.join(', ')})`;
            }
        }
    }

    // Eksekusi langsung dan suntikkan CSS ke halaman sebelum elemen body dibuat (Anti-Kedip)
    const pageBackground = generateRandomGradient();
    document.write(`<style>
      body { 
        background: ${pageBackground} !important; 
        background-attachment: fixed !important; 
      }
    </style>`);
  </script>

	  { title: "Mathepower", url: `https://www.mathepower.com/en/index.php` },

	  { title: "MathCelebrity.ai", url: `https://www.mathcelebrity.com/` },

    function shuffleArray(array) {
	  const newArray = [...array];
	  for (let i = newArray.length - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[newArray[i], newArray[j]] = [newArray[j], newArray[i]];
	  }
	  return newArray;
	}
	
	function newLinkGen(title, index){
		if (title == 'Mathsolar'){
			if (Math.random() < 0.5){
				document.getElementById(`math-button-${index + 1}`).href = `https://www.mathsolar.com/posting/${1+Math.floor(Math.random()*10571)}`;
			}
			else {
				document.getElementById(`math-button-${index + 1}`).href = `https://www.mathsolar.com/materi/${1+Math.floor(Math.random()*310)}`;
			}
			return
		}
		if (title == 'Stack Exchange Mathematics'){
			document.getElementById(`math-button-${index + 1}`).href = `https://math.stackexchange.com/questions/${1+Math.floor(Math.random()*maxIdStackExchange)}`;
			return
		}
		if (title == 'MathOverflow'){
			document.getElementById(`math-button-${index + 1}`).href = `https://mathoverflow.net/questions/${1+Math.floor(Math.random()*maxIdMathOverflow)}`;
			return
		}
		if (title == 'Scribd'){
			document.getElementById(`math-button-${index + 1}`).href = `https://www.scribd.com/doc/${1+Math.floor(Math.random()*901441089)}`;
			return
		}
		if (title == 'Wikipedia'){
			document.getElementById(`math-button-${index + 1}`).href = `https://en.wikipedia.org/wiki/Special:RandomInCategory?wpcategory=${daftarKategori[Math.floor(Math.random() * daftarKategori.length)][0]}`;
			return
		}
		if (title == 'HAL Open Science'){
			document.getElementById(`math-button-${index + 1}`).href = `https://hal.science/hal-${padNumber(1+Math.floor(Math.random()*5138794),8)}`;
			return
		}
		if (title == 'EUDML'){
			document.getElementById(`math-button-${index + 1}`).href = `https://eudml.org/doc/${1+Math.floor(Math.random()*64744)}`;
			return
		}
		if (title == 'Online Encyclopedia of Integer Sequences'){
			document.getElementById(`math-button-${index + 1}`).href = `https://oeis.org/A${padNumber(1+Math.floor(Math.random()*999999),6)}`;
			return
		}
	}
	
	buttonList = [];
    function generateButtons() {
      const shuffledLinks = shuffleArray([...mathLinks]);
      const mainContent = document.getElementById("main-content");
      
      shuffledLinks.slice(0, 12).forEach((link, index) => {
        const anchor = document.createElement("a");
        anchor.href = link.url;
        anchor.target = "_blank";
        anchor.id = `math-button-${index + 1}`;

        const btn = document.createElement("button");
        btn.textContent = link.title;
        btn.className = "math-button";
		btn.id = `math-btn-${index + 1}`;
        btn.style.background = generateRandomGradient(); 
		btn.onclick = () => newLinkGen(link.title, index);
		buttonList.push(btn)

        anchor.appendChild(btn);
        mainContent.appendChild(anchor);
      });
	  
	  for (const btn in buttonList) {
		buttonList[btn].onclick();
	  }
    }

    // Ubah window.onload menjadi fungsi async agar sinkron dan menunggu loading API
    window.onload = async () => {
      // Tunggu hingga permintaan StackExchange API selesai ditarik sepenuhnya
      await getLatestQuestion();

      // Kosongkan bagian 'loader' karena API sudah selesai dimuat
      const mainContent = document.getElementById("main-content");
      mainContent.innerHTML = '';
      
      // Jalankan fungsi pengacak tombol & link
      generateButtons();
      
      // Hapus list elemen blog yang tidak termuat setelah 3 detik
      setTimeout(() => {
          document.querySelectorAll('.blog-links').forEach(el => {
              if (el.innerHTML.trim() === '') {
                  el.style.display = 'none';
              }
          });
      }, 3000); 
    };
  </script>
  
  <script>
	var sisip = Math.floor(Math.random()*5);
	var maxResults = 1,
		daftarweb = ['https://pak-anang.blogspot.com/',
		'https://www.defantri.com/',
		'https://www.folderosn.com/',
		'https://pronouncemath.blogspot.com/',
		'https://www.bank-soal.id/',
		'https://melajah-matematika.blogspot.com/',
		'https://ahmadisroil.blogspot.com/',
		'https://www.catatanmatematika.com/',
		'https://mathsedideas.blogspot.com/',
		'https://www.openalgebra.com/',
		'https://www.trigcheatsheet.com/',
		'https://maths-obsession.blogspot.com/',
		'https://hasbiansyah-cahyadi.blogspot.com/',
		],
		homePage = [];
		countContainerId = 0,
		containerId = 'blog-links';
	function getRandomInt(min, max) {
		return Math.floor(Math.random() * (max - min + 1)) + min;
	}

	function ArlinaRandomPosts(json) {
		var startIndex = getRandomInt(1, (json.feed.openSearch$totalResults.$t - maxResults));
		document.write('<scr' + 'ipt src="' + homePage[countContainerId] + '/feeds/posts/summary?alt=json-in-script&orderby=updated&start-index=' + startIndex + '&max-results=' + maxResults + '&callback=randomPosts"></scr' + 'ipt>');
	}
	function randomPosts(json) {
		var link, ct = document.getElementById(containerId),
			entry = shuffleArray(json.feed.entry),
			skeleton = "";
			countContainerId++;
			containerId = 'blog-links' + countContainerId;
			if (countContainerId-1 == sisip){
				pilihanSisip = articleLinks[Math.floor(Math.random()*articleLinks.length)];
				link = pilihanSisip[1]
				articleTitle = pilihanSisip[0]
			}
			else{
				for (var j = 0, jen = entry[0].link.length; j < jen; j++) {
					link = (entry[0].link[j].rel == "alternate") ? entry[0].link[j].href : '#';
				}
				articleTitle = entry[0].title.$t;
			}
			skeleton += '<a href="' + link + '" target="_blank">' + articleTitle + '</a>';
			ct.innerHTML = skeleton;
	}
	
	for (var i = 0; i < 5; i++){
		containerId = 'blog-links' + countContainerId;
		pilihanweb = Math.floor(Math.random()*(daftarweb.length));
		homePage.push(daftarweb[pilihanweb]);
		document.write('<scr' + 'ipt src="' + homePage[countContainerId] + '/feeds/posts/summary?alt=json-in-script&max-results=0&callback=ArlinaRandomPosts"></scr' + 'ipt>');
	}
  </script>
